<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAGO5 · Configuración — Maqueta auditada 1.3.1 sin backend</title>
<style>
:root{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;color:#182338;background:#f4f6f9;--line:#dce2ea;--blue:#225fcb;--muted:#5e7087;--good:#147f60}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2b71e2;outline-offset:1px}.app{min-height:100vh;width:100%;display:grid;grid-template-columns:202px minmax(0,1fr);grid-template-rows:50px minmax(0,1fr)}.topbar{grid-column:1/-1;display:flex;gap:16px;align-items:center;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);white-space:nowrap}.brand{font-weight:750;font-size:19px;min-width:165px;color:#163967}.crumb{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.mark{margin-left:auto;border:1px solid #d9a64f;background:#fff5d9;color:#6d4d0a;padding:5px 9px;border-radius:3px;font-weight:650;font-size:11px}.mobile-nav{display:none}.side{background:#111b2b;color:#b7c5d8;display:flex;flex-direction:column;padding:12px 8px;gap:2px}.nav{background:transparent;border:0;color:inherit;text-align:left;padding:11px 12px;border-radius:3px;width:100%;font-size:13px}.nav:hover,.nav.on{background:#183968;color:#fff}.environment{margin-top:auto;background:#1b293b;border:1px solid #314357;border-radius:3px;padding:12px;font-size:12px}.content{padding:20px;min-width:0;overflow:auto;height:calc(100vh - 50px)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.head h1{font-size:22px;line-height:1.2;margin:0 0 5px;font-weight:680}.desc{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;color:#24354b;padding:9px 13px;border-radius:4px}.btn:hover{background:#f0f5fd}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.warn{border-color:#e9b8b8;color:#a13333}.btn:disabled{opacity:.48;cursor:not-allowed}.kpis{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin:16px 0}.kpi{background:#fff;border:1px solid var(--line);padding:14px 15px;border-radius:4px}.kpi strong{font-size:23px;display:block}.kpi span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:235px minmax(320px,1fr) 315px;gap:12px;min-height:470px}.panel,.band,.section{background:white;border:1px solid var(--line);border-radius:4px;min-width:0}.panel{padding:12px}.panel h2,.band h2,.section h2{font-size:15px;margin:3px 0 12px}.toolbar{display:flex;gap:6px;margin-bottom:10px}.field{width:100%;padding:9px 10px;border:1px solid #d7dfe9;border-radius:3px;min-width:0;background:#fff}.item{display:block;width:100%;border:1px solid #e2e7ee;background:#fff;text-align:left;border-radius:3px;padding:12px 9px;margin:6px 0;position:relative}.item.active{background:#f0f5ff;border-color:#4b80d5}.name{font-size:13px;font-weight:650}.sub{font-size:11px;color:var(--muted);margin-top:5px}.badge{display:inline-flex;align-items:center;border-radius:3px;font-size:10px;font-weight:650;padding:3px 6px;background:#edf1f7;color:#657389}.badge.mock{background:#fff2c3;color:#725000}.badge.ok{background:#d9f4e6;color:#096947}.badge.off{background:#fce5e6;color:#a72a36}.badge.info{background:#e7effd;color:#2857a0}.right{float:right}.tablewrap{overflow:auto;max-height:386px}.table{border-collapse:collapse;width:100%;font-size:12px}.table th{text-align:left;color:var(--muted);font-weight:650;border-bottom:1px solid var(--line);padding:8px 6px}.table td{border-bottom:1px solid #ecf0f4;padding:9px 6px;vertical-align:middle}.table tr.sel{background:#f0f5ff}.table tr[role='button']{cursor:pointer}.table tr[role='button']:hover{background:#f7faff}.pill{background:#eaf1fc;color:#3862a1;padding:2px 5px;border-radius:3px;margin-right:3px;font-size:10px;white-space:nowrap;display:inline-block}.toggle{width:32px;height:18px;vertical-align:middle;accent-color:#215fc6;cursor:pointer}.tabs,.tabs-inline{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}.tabs button,.tabs-inline button{border:0;background:transparent;padding:10px 11px;border-bottom:2px solid transparent;color:#5c6e86;white-space:nowrap;font-size:12px}.tabs button.current,.tabs-inline button.current{color:#1d5cc6;border-bottom-color:#1d5cc6;font-weight:650}.formrow{margin-bottom:12px}.formrow label{display:block;font-size:12px;color:#4e5f77;margin-bottom:5px}.formrow small{display:block;color:#67788e;margin-top:5px}.actions{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:15px}.actions.end{justify-content:flex-end}.detailtitle{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:5px}.detailtitle strong{font-size:15px}.band{padding:14px;margin-top:12px}.bandrow{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.notice{background:#f5f8fd;border-left:3px solid #82a4d5;padding:10px 12px;color:#536883;font-size:12px;line-height:1.45;margin:10px 0}.routegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.settings-nav{display:flex;gap:4px;margin:2px 0 13px;overflow:auto;padding-bottom:3px}.settings-nav button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px;font-size:12px}.settings-nav button.current{background:#e8f1ff;border-color:#8cb1f4;color:#1e55a5}.settinggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{padding:18px}.cfgrow{display:grid;grid-template-columns:1fr minmax(140px,220px);gap:10px;align-items:center;border-bottom:1px solid #e9eef3;padding:12px 0}.cfgrow:last-child{border:0}.cfgrow label{font-weight:550}.cfgrow small{font-weight:400;color:var(--muted);display:block;margin-top:4px}.section p{font-size:12px;color:var(--muted)}.readonly{color:#7c8897;background:#f5f6f8}.overlay{position:fixed;inset:0;background:#111a29a8;display:flex;align-items:center;justify-content:center;z-index:10;padding:14px}.dialog{background:#fff;border:1px solid #bfcddd;border-radius:4px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 18px 65px #0d1c3555}.dialog.wide{width:min(720px,100%)}.dlghead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.dlghead h2{font-size:17px;margin:0}.dlgbody{padding:18px}.dlgfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.x{border:0;background:transparent;font-size:20px;padding:0 6px}.error{color:#a53035}.footerline{padding:12px 0;color:#748397;font-size:11px} .placeholder{font-size:13px;color:#5d6f85;line-height:1.6} .dateline{font-size:11px;color:#718198;padding-top:7px}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}
@media(max-width:1250px){.layout{grid-template-columns:220px 1fr}.modeldetail{grid-column:1/-1}.settinggrid{grid-template-columns:1fr}}@media(max-width:850px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:50px 39px minmax(0,1fr)}.mobile-nav{display:flex;gap:4px;grid-column:1;grid-row:2;overflow-x:auto;padding:5px 8px;background:#e8edf6;border-bottom:1px solid #cfdae8;white-space:nowrap}.mobile-nav button{border:0;background:#fff;color:#24436f;padding:6px 10px;border-radius:3px;font-size:11px}.mobile-nav button.on{background:#1f5fb9;color:#fff}.side{display:none}.content{height:calc(100vh - 89px);grid-row:3;padding:12px}.layout{grid-template-columns:1fr}.modeldetail{grid-column:1}.kpis{grid-template-columns:repeat(2,1fr)}.head h1{font-size:19px}.bandrow{grid-template-columns:1fr}.topbar{padding:0 11px}.crumb{font-size:11px}.brand{min-width:unset;font-size:15px}.mark{font-size:0}.mark:after{content:"DEMO";font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div id="app"></div><script>
(() => {
const modules=[['general','01 General'],['providers','02 Proveedores y Modelos'],['security','03 Seguridad y Permisos'],['execution','04 Ejecución y Recursos'],['context','05 Contexto y Memoria'],['storage','06 Almacenamiento y Copias'],['system','07 Integraciones y Sistema']];
const initialProviders=[{id:'aws',name:'AWS Bedrock (ejemplo)',type:'cloud',enabled:true},{id:'openai',name:'OpenAI (ejemplo)',type:'cloud',enabled:true},{id:'ollama',name:'Ollama Local (ejemplo)',type:'local',enabled:true},{id:'other',name:'Conector personalizado (ejemplo)',type:'custom',enabled:false}];
const initialModels=[{id:'m1',providerId:'aws',name:'Modelo conversación A',external:'sample-bedrock-model-a',cap:['chat','tools'],enabled:true},{id:'m2',providerId:'aws',name:'Modelo embeddings A',external:'sample-bedrock-embedding-a',cap:['embedding'],enabled:false},{id:'m3',providerId:'openai',name:'Modelo conversación B',external:'sample-openai-model-b',cap:['chat','vision'],enabled:true},{id:'m4',providerId:'ollama',name:'Modelo local A',external:'sample-ollama-model-a',cap:['chat','rag'],enabled:true}];
const initialRoutes={chat:'m1',rag:'m4',embedding:'m2',code:''};
let providers=initialProviders.map(p=>({...p}));let models=initialModels.map(m=>({...m}));let routes={...initialRoutes};
let active='providers',selectedProvider='aws',selectedModel='m1',detailTab='general',modal=null,originFocus=null,searchProvider='',searchModel='',lastMessage='';
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=(title,action,cls='')=>`<button type="button" class="btn ${cls}" data-action="${action}">${esc(title)}</button>`;
const field=(label,input,small='')=>{const id=input.match(/id="([^"]+)"/)?.[1];return `<div class="formrow"><label ${id?`for="${esc(id)}"`:''}>${label}</label>${input}${small?`<small>${small}</small>`:''}</div>`;};
const select=(id,items,value,disabled=false)=>`<select ${disabled?'disabled':''} class="field" id="${id}">${items.map(([k,v])=>`<option value="${esc(k)}" ${k===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
const settings={
 general:{title:'General',subtitle:'Preferencias de la aplicación; no modifican permisos.',groups:[['Apariencia',[['Tema','Sistema','Tema de la aplicación'],['Idioma','Español','Idioma de interfaz'],['Densidad','Compacta','Presentación visual']]],['Inicio',[['Vista inicial','Última pantalla','Preferencia de navegación'],['Restaurar ventanas','Sí','Sin ejecutar trabajos']]]]},
 security:{title:'Seguridad y Permisos',subtitle:'Las políticas no emiten grants. Propietario: SecurityPolicyManager.',groups:[['Política global',[['Decisión predeterminada','DENY','No concede autoridad'],['Aprobación humana','Requerida','Restringe las acciones críticas'],['Duración máxima de grant','Una operación','AutorizaciónService es el propietario de los grants']]],['Grants',[['Autorizaciones vigentes','No consultadas','Sólo lectura hasta integrar AuthorizationService'],['Revocar grant','No disponible en maqueta','Nunca simular revocación real']]]]},
 execution:{title:'Ejecución y Recursos',subtitle:'Límites técnicos ≠ permisos. Propietario: ExecutionPolicyManager.',groups:[['Recursos',[['Concurrencia máxima','2 (ejemplo)','No impuesta por esta maqueta'],['Timeout','60 s (ejemplo)','No impuesta por esta maqueta'],['Reintentos','2 (ejemplo)','Sin backend']]],['Seguridad técnica',[['Perfil sandbox','No verificado','No afirmar aislamiento OS'],['Receipt obligatorio','Especificado','Necesita ejecución real para comprobar']]]]},
 context:{title:'Contexto y Memoria',subtitle:'Políticas globales. Las fuentes concretas pertenecen al proyecto.',groups:[['Retención',[['Memoria por conversación','Separada','No compartir por defecto'],['Aislamiento entre proyectos','Obligatorio','Contexto independiente'],['Retención','Según política','Sin borrado efectivo en maqueta']]],['Indexación',[['Indexación automática','Desactivada','No accede a fuentes'],['Fuente registrada','No equivale a acceso','Un permiso real debe emitirse explícitamente']]]]},
 storage:{title:'Almacenamiento y Copias',subtitle:'Migrar/restaurar requiere preflight. Propietario: StorageManager.',groups:[['Persistencia',[['Directorio de datos','No conectado','No se accede al sistema de archivos'],['Base de datos','No consultada','Sin API backend'],['Integridad','NOT_RUN','No se ha realizado verificación']]],['Copias',[['Última copia','No consultada','Sólo ejemplo visual'],['Restauración','Bloqueada en maqueta','No debe sobreescribir datos por guardar']]]]},
 system:{title:'Integraciones y Sistema',subtitle:'Dependencias no LLM; registrar no habilita herramientas MCP.',groups:[['Dependencias',[['Python','No comprobado','No se sondean ejecutables locales'],['Docker','No comprobado','No se ejecutan procesos'],['Git','No comprobado','No concede uso de git a agentes']]],['Conexiones externas',[['GitHub','No configurado','Sin credenciales'],['MCP / Tools','Ir al registro de herramientas','No se administran aquí']]]]},
};
function render(){
let main=''; if(active==='providers') main=providersView(); else if(settings[active]) main=sectionView(active);else main=otherView(active);
app.innerHTML=`<div class="app"><header class="topbar"><span class="brand">◈ BAGO5</span><span class="crumb">Inicio / ${active==='providers'?'Configuración / Proveedores y Modelos':(settings[active]?'Configuración / '+settings[active].title:active)}</span><span class="mark">DEMO 1.3.1 · SIN BACKEND</span></header><div class="mobile-nav" aria-label="Navegación rápida móvil">${[['chat','Chat'],['projects','Proyectos'],['agents','Agentes'],['providers','Configuración']].map(([key,title])=>`<button class="${key===active?'on':''}" data-action="goto:${key}">${title}</button>`).join('')}</div><nav class="side" aria-label="Navegación global">${[['chat','Chat'],['projects','Proyectos'],['agents','Agentes'],['tools','Herramientas (MCP)'],['jobs','Ejecución'],['eval','Evaluación'],['trace','Observabilidad']].map(([key,title])=>`<button class="nav ${key===active?'on':''}" data-action="goto:${key}">${title}</button>`).join('')}<button class="nav ${modules.some(([k])=>active===k)?'on':''}" data-action="goto:providers">⚙ Configuración</button><div class="environment"><span style="color:#48c29e">●</span> Entorno: Maqueta HTML<br><small>Valores simulados · cero llamadas</small></div></nav><main class="content">${modules.some(([k])=>active===k)?`<div class="settings-nav" aria-label="Secciones de configuración">${modules.map(([k,t])=>`<button class="${k===active?'current':''}" data-action="goto:${k}">${t}</button>`).join('')}</div>`:''}${main}<div class="footerline">Referencia de UX derivada · parche local 1.3.1 · Los estados mostrados son simulados. Ninguna operación toca proveedores ni archivos reales.</div></main></div>${modal?modalHtml():''}`;
app.querySelector('.app').inert=Boolean(modal);
if(modal){const target=app.querySelector('.dialog input:not([readonly]),.dialog select:not([disabled])')||app.querySelector('.dialog button');if(target)target.focus();}
}
function providersView(){const countActive=models.filter(x=>x.enabled).length;const prov=providers.find(x=>x.id===selectedProvider)||providers[0];const visible=models.filter(x=>x.providerId===prov?.id&&x.name.toLowerCase().includes(searchModel.toLowerCase()));const picked=models.find(x=>x.id===selectedModel)||visible[0];const providerCount=providers.filter(p=>p.name.toLowerCase().includes(searchProvider.toLowerCase()));
return `<div class="head"><div><h1>Proveedores y Modelos</h1><div class="desc">Registra proveedores, selecciona modelos y consulta límites de uso.</div></div>${bn('+ Añadir proveedor','modal:add-provider','primary')}</div><div class="kpis"><div class="kpi"><strong>${providers.length}</strong><span>Proveedores registrados · mock</span></div><div class="kpi"><strong>${models.length}</strong><span>Modelos de ejemplo</span></div><div class="kpi"><strong>${countActive}</strong><span>Habilitados en la maqueta</span></div><div class="kpi"><strong>${Object.values(routes).filter(Boolean).length}</strong><span>Rutas de demostración</span></div></div><div class="layout"><section class="panel"><h2>Proveedores</h2><div class="toolbar"><input class="field" id="searchProvider" aria-label="Buscar proveedor" placeholder="Buscar proveedor..." value="${esc(searchProvider)}"></div>${providerCount.map(p=>`<button class="item ${p.id===selectedProvider?'active':''}" data-action="choose-provider:${p.id}"><span class="name">${esc(p.name)}</span><span class="badge mock right">SIN PROBAR</span><div class="sub">${p.type==='local'?'Local':'Conexión de ejemplo'} · ${models.filter(m=>m.providerId===p.id).length} modelos</div></button>`).join('')||'<div class="notice">No hay proveedores coincidentes</div>'}${bn('Editar proveedor','modal:edit-provider')} <div class="dateline">La habilitación no confirma conectividad.</div></section><section class="panel"><div class="split"><div><h2>${esc(prov?.name??'Selecciona proveedor')}</h2><span class="badge mock">Disponibilidad NO VERIFICADA</span></div>${bn('Registrar modelo','modal:register-model')}</div><div class="toolbar" style="margin-top:12px"><input class="field" id="searchModel" aria-label="Buscar modelo" placeholder="Buscar modelo..." value="${esc(searchModel)}"></div><div class="tablewrap"><table class="table"><thead><tr><th>Activo</th><th>Modelo</th><th>Capacidad</th><th>Disponibilidad</th></tr></thead><tbody>${visible.map(m=>`<tr class="${picked?.id===m.id?'sel':''}" role="button" tabindex="0" data-action="choose-model:${m.id}"><td><input type="checkbox" class="toggle" aria-label="Habilitar ${esc(m.name)}" data-toggle-model="${m.id}" ${m.enabled?'checked':''}></td><td><strong>${esc(m.name)}</strong><div class="sub">${esc(m.external)}</div></td><td>${m.cap.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</td><td><span class="badge mock">NO VERIF.</span></td></tr>`).join('')||`<tr><td colspan="4">Sin modelos. Puedes registrar uno manualmente.</td></tr>`}</tbody></table></div><div class="actions">${bn('Actualizar catálogo','modal:discover')}<span class="muted" style="font-size:11px">No consulta servicios reales</span></div></section><section class="panel modeldetail"><div class="detailtitle"><strong>${esc(picked?.name??'Selecciona modelo')}</strong><span class="badge mock">DEMO</span></div><div class="tabs">${[['general','General'],['params','Parám.'],['uses','Uso'],['tests','Pruebas']].map(([k,n])=>`<button class="${detailTab===k?'current':''}" data-action="detail:${k}">${n}</button>`).join('')}</div>${detail(picked)}<div class="actions end">${bn('Probar','modal:diagnostic')} ${bn('Guardar cambios','save-mock','primary')}</div></section></div><div class="bandrow"><section class="band"><div class="split"><h2>Enrutamiento por función</h2>${bn('Gestionar rutas','modal:routing')}</div><div class="routegrid">${Object.entries(routes).map(([key,val])=>`<div class="sub">${esc(key)}</div><div><strong>${esc(models.find(m=>m.id===val)?.name||'Sin asignar')}</strong></div>`).join('')}</div><p class="dateline">Asignaciones de ejemplo · resolver no ejecutado.</p></section><section class="band"><h2>Diagnóstico y evidencia</h2><p class="notice">No se realizan comprobaciones de conexión ni inferencia. Una prueba real podría consumir recursos y requiere autorización explícita.</p>${bn('Abrir prueba','modal:diagnostic')}</section></div>${lastMessage?`<div class="notice" role="status">${esc(lastMessage)}</div>`:''}`;
}
function detail(m){if(!m)return '<div class="notice">Selecciona un modelo.</div>';
if(detailTab==='general')return `${field('ID del modelo',`<input class="field readonly" readonly value="${esc(m.external)}">`)}${field('Proveedor',`<input class="field readonly" readonly value="${esc(providers.find(p=>p.id===m.providerId)?.name||'')}"/>`)}${field('Capacidades declaradas',`<div>${m.cap.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div>`,'Las capacidades no se han comprobado con la API.')}${field('Habilitado en demo',`<strong>${m.enabled?'Sí':'No'}</strong>`,'Habilitado ≠ conectado ≠ autorizado.')}<div class="notice">Registro simulado. Sin recibos ni validaciones externas.</div>`;
if(detailTab==='params')return `${m.cap.includes('embedding')?'<div class="notice">Los modelos de embeddings no muestran controles de temperatura de chat.</div>':`${field('Temperatura (sólo ejemplo)',`<input class="field" type="number" min="0" max="2" step="0.1" id="temperature" value="0.7">`)}${field('Salida máxima (sólo ejemplo)',`<input class="field" type="number" min="1" id="max-tokens" value="1024">`)}`}<div class="notice">Parámetros no aplicados a servicios reales.</div>`;
if(detailTab==='uses')return `<div class="notice">Estas asignaciones son ejemplos. Antes de deshabilitar, consultar las dependencias reales.</div>${Object.entries(routes).filter(([k,v])=>v===m.id).map(([k])=>`<p>Ruta: <strong>${esc(k)}</strong> · DEMO</p>`).join('')||'<p class="placeholder">Sin rutas configuradas.</p>'}${bn('Inspeccionar dependencias','modal:dependencies')}`;
return `<div class="notice">Disponibilidad: NOT_RUN. Las pruebas de proveedor y modelo están desconectadas deliberadamente.</div>${bn('Abrir diagnóstico','modal:diagnostic')}`;
}
function sectionView(key){const s=settings[key];return `<div class="head"><div><h1>${s.title}</h1><div class="desc">${s.subtitle}</div></div><span class="badge mock">SÓLO MAQUETA</span></div><div class="settinggrid">${s.groups.map(([title,rows])=>`<section class="section"><h2>${title}</h2>${rows.map(([l,v,help])=>`<div class="cfgrow"><label>${l}<small>${help}</small></label><input aria-label="${esc(l)}" class="field readonly" readonly value="${esc(v)}"></div>`).join('')}</section>`).join('')}</div><div class="band"><div class="split"><div><strong>Propietario canónico, no esta página</strong><div class="desc">Esta maqueta no puede ejecutar operaciones externas ni persistir políticas.</div></div>${bn('Guardar · NO IMPLEMENTADO','unavailable')}</div></div>`;}
function otherView(key){return `<div class="head"><div><h1>${esc(({projects:'Proyectos',agents:'Agentes',chat:'Chat',tools:'Herramientas',jobs:'Ejecución',eval:'Evaluación',trace:'Observabilidad'})[key]||key)}</h1><div class="desc">Vista contextual · únicamente como referencia de navegación y alcance.</div></div>${bn('Ir a configuración','goto:providers')}</div><section class="section"><h2>Ámbitos sin duplicación</h2><p class="placeholder">En <strong>Proyectos</strong> se guardan fuentes propias y referencias a modelos permitidos. En <strong>Agentes</strong>, identidad, instrucciones y modelo preferido. El chat conserva los overrides temporales. La autorización y los servicios reales permanecen fuera de este mock.</p><div class="notice">GLOBAL → PROYECTO → AGENTE → CONVERSACIÓN → RESOLUCIÓN EFECTIVA → AUTORIZACIÓN EN EJECUCIÓN</div><p class="placeholder">Configuración efectiva y dependencias necesitarán consulta al backend y procedencia por campo. Esta navegación no simula permisos.</p></section>`;}
function modalHtml(){const wide=['routing','dependencies'].includes(modal);const names={'add-provider':'Añadir proveedor','edit-provider':'Editar proveedor','register-model':'Registrar modelo','diagnostic':'Diagnóstico explícito','routing':'Enrutamiento de modelos','dependencies':'Dependencias del modelo','delete-provider':'Confirmación de cambio crítico','discover':'Descubrir catálogo'};
let body='';let btn='Cerrar';let submit='close';
if(modal==='add-provider'||modal==='edit-provider'){
const editing=modal==='edit-provider';const current=editing?providers.find(p=>p.id===selectedProvider):null;
body=`${field('Tipo de proveedor',select('p-type',[['local','Local'],['cloud','Cloud'],['custom','Personalizado']],current?.type||'local'))}${field('Nombre visible',`<input class="field" id="p-name" placeholder="Ej. Proveedor de pruebas" maxlength="70" value="${esc(current?.name||'')}">`)}${field('Autenticación',select('auth-method',[['none','Ninguna (local)'],['keyref','Referencia a secreto'],['role','Rol / identidad gestionada']],'none'))}${field('Referencia a credencial','<input class="field readonly" readonly placeholder="No se admiten claves en esta maqueta">','Nunca introduzcas API Keys aquí.')}${field('Endpoint','<input class="field" id="p-endpoint" placeholder="(opcional; no se conecta)">')}<div class="notice">Se guarda sólo un registro ficticio en memoria de esta pestaña. Conectividad: NO VERIFICADA.</div>`;
btn=editing?'Guardar edición en mock':'Registrar en mock';submit=editing?'edit-provider':'add-provider';}

if(modal==='register-model'){body=`${field('Proveedor actual',`<input class="field readonly" readonly value="${esc(providers.find(p=>p.id===selectedProvider)?.name||'')}">`)}${field('Identificador externo',`<input id="m-external" class="field" placeholder="id-del-modelo">`)}${field('Nombre visible',`<input id="m-name" class="field" placeholder="Nuevo modelo">`)}${field('Capacidades declaradas',select('m-cap',[['chat','Chat'],['embedding','Embeddings'],['vision','Visión']],'chat'))}<div class="notice">El registro no activa modelos ni confirma capacidades o disponibilidad.</div>`;btn='Registrar en mock';submit='register-model';}
if(modal==='routing'){body=`<p class="placeholder">Rutas globales ficticias. No contienen aprobación de transferencia a la nube.</p>${Object.keys(routes).map(k=>field(`Función ${esc(k)}`,select('route-'+k,[['','Sin asignar'],...models.map(m=>[m.id,m.name+(m.enabled?'':' · DESHABILITADO')])],routes[k]))).join('')}<div class="notice">Una ruta no autoriza llamadas a modelos. El fallback requiere revisión de políticas y egress.</div>`;btn='Guardar sólo en maqueta';submit='routing';}
if(modal==='diagnostic'){body=`${field('Alcance',select('diag-type',[['connection','Conectividad del proveedor'],['inference','Inferencia del modelo']],'connection'))}<div class="notice">Una prueba real puede generar costes. Esta maqueta no contiene conexión, API Key ni runner de diagnósticos. Resultado correcto: <strong>NOT_IMPLEMENTED / NOT_RUN</strong>.</div><div class="badge mock">NO EJECUTADO</div>`;btn='Cerrar';submit='close';}
if(modal==='dependencies'){body=`<div class="notice">Vista DEMO: dependencias de ejemplo, no inspección real del repositorio.</div><p>Proyecto DEMO · Agente DEMO · Ruta chat</p><p class="placeholder">En un backend real: preguntar a sus owners por proyecto/agente/ruta/ejecución y bloquear los cambios destructivos sin resolver impacto.</p>`;btn='Cerrar';submit='close';}
if(modal==='discover'){body='<div class="notice">Descubrimiento automático requiere API real y puede no existir en todos los proveedores. Esta maqueta no hace llamadas.</div>';}
if(modal==='delete-provider'){body='<div class="notice">Acción bloqueada: no hay preflight real ni referencia de dependencias. No se deshabilitan proveedores con impacto desde el mock.</div>';}
return `<div class="overlay" data-action="outside-close"><div class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dlghead"><h2 id="dialog-title">${names[modal]||'Acción'}</h2><button class="x" type="button" aria-label="Cerrar ventana" data-action="close-modal">×</button></div><div class="dlgbody">${body}</div><div class="dlgfoot">${bn('Cancelar','close-modal')}${submit==='close'?'':bn(btn,'submit:'+submit,'primary')}</div></div></div>`;
}
function closeModal(){const restore=originFocus;modal=null;render();if(restore)[...app.querySelectorAll('[data-action]')].find(el=>el.dataset.action===restore)?.focus();originFocus=null;}
function handler(el){const a=el.dataset.action||'';
if(a.startsWith('goto:')){active=a.slice(5);lastMessage='';modal=null;return render();}
if(a.startsWith('choose-provider:')){selectedProvider=a.slice(16);selectedModel=models.find(m=>m.providerId===selectedProvider)?.id||'';detailTab='general';return render();}
if(a.startsWith('choose-model:')){selectedModel=a.slice(13);detailTab='general';return render();}
if(a.startsWith('detail:')){detailTab=a.slice(7);return render();}
if(a.startsWith('modal:')){modal=a.slice(6);originFocus=a;return render();}
if(a==='close-modal'||a==='outside-close'){closeModal();return;}
if(a==='save-mock'){lastMessage='Maqueta únicamente: cambios del mock no son configuración efectiva, ni se persistieron en backend.';return render();}
if(a==='unavailable'){lastMessage='Operación NO IMPLEMENTADA en esta maqueta. No se modificó el sistema.';return render();}
if(a.startsWith('submit:')){
 const op=a.slice(7);
 if(op==='add-provider'){const n=document.getElementById('p-name')?.value.trim();if(!n){alert('Introduce un nombre visible.');return;}const id='demo-'+Date.now();providers.push({id,name:n+' (mock)',type:document.getElementById('p-type').value,enabled:false});selectedProvider=id;selectedModel='';lastMessage='Proveedor registrado sólo en memoria del mock; conexión NO VERIFICADA.';}
 if(op==='edit-provider'){const n=document.getElementById('p-name')?.value.trim();if(!n){alert('Introduce un nombre visible.');return;}const current=providers.find(p=>p.id===selectedProvider);if(!current)return;current.name=n;current.type=document.getElementById('p-type').value;lastMessage='Proveedor editado sólo en memoria del mock; identidad y modelos conservados. Conexión NO VERIFICADA.';}
 if(op==='register-model'){const n=document.getElementById('m-name')?.value.trim(),e=document.getElementById('m-external')?.value.trim();if(!n||!e){alert('Introduce nombre e ID externo.');return;}const id='demo-model-'+Date.now();models.push({id,name:n,external:e,providerId:selectedProvider,cap:[document.getElementById('m-cap').value],enabled:false});selectedModel=id;lastMessage='Modelo creado sólo en la maqueta, deshabilitado y sin verificar.';}
 if(op==='routing'){Object.keys(routes).forEach(k=>{routes[k]=document.getElementById('route-'+k).value;});lastMessage='Rutas cambiadas sólo en memoria del mock. Sin resolver autorización/ejecución.';}
 closeModal();return;
 }
}
app.addEventListener('click',ev=>{if(ev.target.closest('[data-toggle-model]'))return;const e=ev.target.closest('[data-action]');if(!e)return;if(e.dataset.action==='outside-close'&&ev.target!==e)return;handler(e);});
app.addEventListener('change',ev=>{const el=ev.target.closest('[data-toggle-model]');if(!el)return;const m=models.find(x=>x.id===el.dataset.toggleModel);if(!m)return;m.enabled=el.checked;lastMessage='Habilitación cambiada SÓLO EN MOCK. No cambia disponibilidad, autorización ni acceso real.';render();});
app.addEventListener('input',ev=>{if(ev.target.id==='searchProvider'){searchProvider=ev.target.value;const start=ev.target.selectionStart;render();let input=document.getElementById('searchProvider');input?.focus();input?.setSelectionRange(start,start);}if(ev.target.id==='searchModel'){searchModel=ev.target.value;const start=ev.target.selectionStart;render();let input=document.getElementById('searchModel');input?.focus();input?.setSelectionRange(start,start);}});
app.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){ev.preventDefault();closeModal();return;}if(ev.key==='Tab'&&modal){const items=[...app.querySelectorAll('.dialog button:not([disabled]),.dialog input:not([disabled]),.dialog select:not([disabled]),.dialog textarea:not([disabled])')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}}const row=ev.target.closest('tr[data-action]');if(row&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();handler(row);}});
render();
})();
</script></body></html>
